name: update socktainer versions

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  update:
    name: Update supported Apple container / socktainer versions
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Execute pnpm
        run: pnpm install --frozen-lockfile

      - name: Update socktainer-versions.json
        run: pnpm update-socktainer-versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PODMAN_DESKTOP_BOT_TOKEN }}
          branch: update-socktainer-versions
          add-paths: socktainer-versions.json
          commit-message: 'chore: update supported Apple container / socktainer versions'
          title: 'chore: update supported Apple container / socktainer versions'
          body: Update `socktainer-versions.json` to the latest patch of the last 3 Apple container minor versions and their socktainer counterpart.
          signoff: true
          delete-branch: true
